name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Packages / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build core packages
        run: npx turbo run build --filter="./packages/*"

      - name: Run unit tests
        run: npx turbo run test --filter="./packages/*"

      - name: Run cross-SDK conformance tests
        run: npm run conformance

      - name: Run typecheck
        run: npx turbo run typecheck --filter="./packages/*"

  apps:
    name: Apps / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js demo & docs apps
        run: npx turbo run build --filter="./apps/*"

      - name: Typecheck Next.js apps
        run: npx turbo run typecheck --filter="./apps/*"

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit & failure simulation tests
        run: uv run --project packages/python --with pytest --with pytest-asyncio pytest packages/python/tests

      - name: Run cross-SDK conformance tests
        run: uv run --project packages/python --with pytest --with pytest-asyncio pytest packages/python/tests/test_conformance.py

      - name: Run strict mypy typecheck
        run: uv run --project packages/python --with mypy mypy packages/python/src
